name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and prove invariants
    runs-on: ubuntu-latest
    # Testcontainers needs a Docker daemon; ubuntu-latest ships one.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build
        run: ./gradlew build -x test --console=plain
      - name: Invariant tests against real Postgres
        run: ./gradlew test --console=plain
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency and filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'
