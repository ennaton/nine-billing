spring:
  application:
    name: nine-billing
  datasource:
    # Matches nine-infra compose: separate database per service, non-superuser
    # role. Override with SPRING_DATASOURCE_* in any other environment.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/nine_billing}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 18081
