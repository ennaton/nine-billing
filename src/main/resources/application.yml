spring:
  application:
    name: nine-billing

  # Two roles on purpose, and neither of them is a superuser.
  #
  # The runtime datasource is nine_app: not a superuser, not the table owner.
  # Both of those bypass row-level security, so the app must be neither, or
  # every policy in V4 is decoration.
  #
  # Flyway migrates as nine_owner, because creating tables, triggers and
  # policies needs the owner. It never serves a request. The reason it is not
  # postgres is blunter than the RLS argument: this credential lives in a
  # deployment's configuration, and as the cluster superuser it reached every
  # database on the server, nine_core included. It now owns one database.
  #
  # FORCE ROW LEVEL SECURITY on top of that is an accident guard rather than a
  # boundary: measured, a superuser owner reads every row with no tenant bound
  # and nine_owner reads none, but nine_owner can still lift the policy with one
  # ALTER TABLE. db/bootstrap.sql creates the role and has to run once, as a
  # superuser, before this ever connects.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/nine_billing}
    username: ${SPRING_DATASOURCE_USERNAME:nine_app}
    password: ${SPRING_DATASOURCE_PASSWORD:nine_app_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/nine_billing}
    user: ${NINE_MIGRATION_USERNAME:nine_owner}
    password: ${NINE_MIGRATION_PASSWORD:nine_owner_dev}
    placeholders:
      # V9 creates nine_operator with this. It is a placeholder rather than a
      # literal in the migration so that the deployment supplies the real one
      # and the file in git holds a development default only. V4 hardcodes
      # nine_app's password and that is BI16.3, still open; this is the
      # mechanism that closes it without inventing anything.
      operatorPassword: ${NINE_OPERATOR_PASSWORD:nine_operator_dev}
      # V12 sets nine_app's password from this. Same variable as the datasource
      # above, so a deployment cannot supply one and forget the other.
      appPassword: ${SPRING_DATASOURCE_PASSWORD:nine_app_dev}

nine:
  billing:
    reconcile:
      interval: ${NINE_RECONCILE_INTERVAL:PT15M}
      # An upper bound on one run, so a run waiting on a lock ends by itself
      # rather than holding the scheduler until someone notices.
      timeout: ${NINE_RECONCILE_TIMEOUT:PT2M}
    # Required to mint API keys via POST /admin/keys. Empty disables minting.
    bootstrap-secret: ${NINE_BOOTSTRAP_SECRET:}
    # The second database role. Reconciliation and the first key for a new
    # tenant run as this; nothing an HTTP caller controls reaches it. It is
    # narrower than nine_app, not wider: it may read across every tenant, and
    # it holds no grant at all on accounts, price_plans or account_balances.
    operator:
      username: ${NINE_OPERATOR_USERNAME:nine_operator}
      password: ${NINE_OPERATOR_PASSWORD:nine_operator_dev}

management:
  endpoints:
    web:
      # metrics is deliberately not published. http.server.requests counts by
      # URI, so a reachable metrics endpoint reports how often /admin/keys was
      # called and with what outcome, which is an oracle for guessing the
      # bootstrap secret. Putting a key in front of it narrows that to anyone
      # holding any tenant key, which is not closing it. Nothing consumes this
      # endpoint today; when BI7 needs real metrics they leave over OTel rather
      # than a scraped URL.
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Boot's own probe groups hold one member each, livenessState and
        # readinessState, so nothing else reaches a probe until it is named
        # here. A service that cannot reach the ledger must stop taking
        # traffic, which is readiness. It stays out of liveness on purpose:
        # restarting the process does not bring the database back.
        readiness:
          include: readinessState, db

server:
  port: 18081
